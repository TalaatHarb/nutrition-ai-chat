apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-ai-chat-fe
  namespace: nutrition-ai-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nutrition-ai-chat-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nutrition-ai-chat-fe
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/talaatharb/nutrition-ai-chat-fe
          envFrom:
            - configMapRef:
                name: nutrition-ai-chat-fe-config
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
