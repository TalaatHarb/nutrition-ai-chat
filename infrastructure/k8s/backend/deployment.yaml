apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-ai-chat-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nutrition-ai-chat-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nutrition-ai-chat-be
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: ghcr.io/talaatharb/nutrition-ai-chat-be
          envFrom:
            - configMapRef:
                name: nutrition-ai-chat-be-config
          env:
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nutrition-ai-chat-be-secret
                  key: OLLAMA_API_KEY
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
